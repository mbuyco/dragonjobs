name: Refresh Jobs

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  ingest:
    uses: ./.github/workflows/ingest-jobs-reusable.yml
    with:
      use_sqlite_cache: true
      require_data_changed_for_artifact: true

  deploy:
    needs: ingest
    if: needs.ingest.outputs.dataChanged == 'true'
    uses: ./.github/workflows/deploy-pages-reusable.yml

  deploy-netlify:
    needs: ingest
    if: needs.ingest.outputs.dataChanged == 'true'
    uses: ./.github/workflows/deploy-netlify-reusable.yml
    secrets: inherit
