name: Refresh Jobs

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  ingest-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        run: cd backend && npm ci

      - name: Run migrations
        run: cd backend && npm run db:migrate

      - name: Run ingest
        run: cd backend && npm run ingest
        env:
          INGEST_KEYWORDS: ${{ vars.INGEST_KEYWORDS || 'developer,software engineer,devops' }}
          KALIBRR_MAX_PAGES: ${{ vars.KALIBRR_MAX_PAGES || '5' }}
          REMOTIVE_CATEGORY: ${{ vars.REMOTIVE_CATEGORY || 'software-dev' }}
          JOB_TTL_HOURS: ${{ vars.JOB_TTL_HOURS || '24' }}

      - name: Export jobs
        run: cd backend && npm run export:jobs

      - name: Verify summary exists
        run: test -f backend/data/ingest-summary.json

      - name: Check if data changed
        id: check
        run: |
          dataChanged=$(jq -r '.dataChanged' backend/data/ingest-summary.json)
          echo "dataChanged=$dataChanged" >> $GITHUB_OUTPUT
          echo "Data changed: $dataChanged"

      - name: Commit and push jobs.json
        if: steps.check.outputs.dataChanged == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/jobs.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: refresh jobs cache"
          git push
