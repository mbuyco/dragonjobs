name: Refresh Jobs

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      dataChanged: ${{ steps.check.outputs.dataChanged }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure data directory
        run: mkdir -p backend/data

      # Fixed prefix dragonjobs-sqlite-v1; run_id suffix so save always updates
      # (actions/cache skips post-save on exact key hit).
      - name: Restore SQLite cache
        uses: actions/cache/restore@v4
        with:
          path: backend/data/dragonjobs.db
          key: dragonjobs-sqlite-v1-${{ github.run_id }}
          restore-keys: |
            dragonjobs-sqlite-v1-

      - name: Install backend deps
        run: cd backend && npm ci

      - name: Run migrations
        run: cd backend && npm run db:migrate

      - name: Run ingest
        run: cd backend && npm run ingest
        env:
          INGEST_KEYWORDS: ${{ vars.INGEST_KEYWORDS || 'developer,software engineer,devops' }}
          KALIBRR_MAX_PAGES: ${{ vars.KALIBRR_MAX_PAGES || '5' }}
          REMOTIVE_CATEGORY: ${{ vars.REMOTIVE_CATEGORY || 'software-dev' }}
          INGEST_LOOKBACK_HOURS: ${{ vars.INGEST_LOOKBACK_HOURS || '24' }}
          JOB_TTL_HOURS: ${{ vars.JOB_TTL_HOURS || '72' }}

      - name: Save SQLite cache
        uses: actions/cache/save@v4
        with:
          path: backend/data/dragonjobs.db
          key: dragonjobs-sqlite-v1-${{ github.run_id }}

      - name: Export jobs
        run: cd backend && npm run export:jobs

      - name: Verify summary exists
        run: test -f backend/data/ingest-summary.json

      - name: Check if data changed
        id: check
        run: |
          dataChanged=$(jq -r '.dataChanged' backend/data/ingest-summary.json)
          echo "dataChanged=$dataChanged" >> $GITHUB_OUTPUT
          echo "Data changed: $dataChanged"

      - name: Upload jobs.json for deploy
        if: steps.check.outputs.dataChanged == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jobs-json
          path: public/jobs.json
          retention-days: 1

  deploy:
    needs: ingest
    if: needs.ingest.outputs.dataChanged == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download jobs.json
        uses: actions/download-artifact@v4
        with:
          name: jobs-json
          path: public

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify jobs.json in dist
        run: test -f dist/jobs.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
