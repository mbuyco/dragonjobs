schema: spec-driven

context: |
  DragonJobs is a static developer job board — a single-page React 19 app with no backend,
  no routing library, and no data fetching. Job postings are a hardcoded array in App.tsx.
  Build verification is `npm run build` (tsc + Vite); there is no lint or test setup.
  Search/filter UI exists but does not yet affect the job list. Links to /job/:id and /login
  exist but those views are not implemented. Styling is global CSS in src/styles.css (dark theme).
  PWA via vite-plugin-pwa with service worker enabled in dev.

